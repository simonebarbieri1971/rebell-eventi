<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebell — Event Scout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #C4227B;
    --navy: #1A1A2E;
    --pink-light: #f5d6ea;
    --pink-mid: #e8a0c8;
    --bg: #f8f4f7;
    --card-bg: #ffffff;
    --text: #1A1A2E;
    --text-muted: #6b6480;
    --border: #e8dded;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--navy);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--pink);
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--pink);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 13px;
    color: white;
    letter-spacing: -0.5px;
  }
  .header-title {
    font-size: 15px;
    font-weight: 500;
    color: white;
    letter-spacing: 0.3px;
  }
  .header-sub {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--pink-mid);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--pink-mid);
    text-align: right;
  }

  /* MAIN LAYOUT */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 48px;
  }

  /* CONTROL PANEL */
  .control-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .panel-title {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--pink);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) { .filter-grid { grid-template-columns: 1fr; } }

  .filter-group label {
    display: block;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg);
    color: var(--text-muted);
    user-select: none;
  }
  .tag:hover { border-color: var(--pink); color: var(--pink); }
  .tag.active {
    background: var(--pink);
    border-color: var(--pink);
    color: white;
  }

  .select-styled {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    appearance: none;
    cursor: pointer;
  }
  .select-styled:focus { outline: 2px solid var(--pink); outline-offset: 1px; }

  .search-btn {
    width: 100%;
    padding: 14px 24px;
    background: var(--pink);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.15s;
    letter-spacing: 0.2px;
  }
  .search-btn:hover { background: #a81c69; transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }
  .search-btn:disabled { background: var(--pink-mid); cursor: not-allowed; transform: none; }

  /* STATUS */
  .status-bar {
    display: none;
    background: var(--navy);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--pink-mid);
    align-items: center;
    gap: 10px;
  }
  .status-bar.visible { display: flex; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(196,34,123,0.3);
    border-top-color: var(--pink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESULTS */
  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .results-count {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-muted);
  }
  .results-count span { color: var(--pink); font-weight: 500; }

  .events-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .event-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    transition: border-color 0.15s, box-shadow 0.15s;
    animation: fadeIn 0.3s ease;
  }
  .event-card:hover { border-color: var(--pink); box-shadow: 0 2px 16px rgba(196,34,123,0.07); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .event-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .badge {
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }
  .badge-topic {
    background: var(--pink-light);
    color: var(--pink);
  }
  .badge-format {
    background: #e8eaf6;
    color: #3949ab;
  }
  .badge-gratuito {
    background: #e8f5e9;
    color: #2e7d32;
  }
  .badge-pagamento {
    background: #fff3e0;
    color: #e65100;
  }
  .badge-data {
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .event-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .event-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .event-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .event-org {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-muted);
  }

  .event-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--pink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    transition: opacity 0.15s;
  }
  .event-link:hover { opacity: 0.75; }

  /* EMPTY / ERROR */
  .message-box {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .message-box .icon {
    font-size: 36px;
    margin-bottom: 12px;
  }
  .message-box p {
    font-size: 14px;
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto;
  }

  /* SUMMARY BOX */
  .summary-box {
    background: var(--navy);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--pink-mid);
    line-height: 1.7;
    font-family: var(--mono);
    white-space: pre-wrap;
    display: none;
  }
  .summary-box.visible { display: block; }

  .section-label {
    font-size: 10px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--pink);
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-mark">R</div>
    <div>
      <div class="header-title">Rebell Event Scout</div>
      <div class="header-sub">Compliance · AML · Risk · Privacy</div>
    </div>
  </div>
  <div class="header-date" id="header-date"></div>
</div>

<div class="container">

  <div class="control-panel">
    <div class="panel-title">⬡ Parametri di ricerca</div>

    <div class="filter-grid">
      <div class="filter-group">
        <label>Temi</label>
        <div class="tag-grid" id="topic-tags">
          <div class="tag active" data-val="AML/CFT">AML/CFT</div>
          <div class="tag active" data-val="Antifrode">Antifrode</div>
          <div class="tag active" data-val="Compliance">Compliance</div>
          <div class="tag active" data-val="Privacy/GDPR">Privacy/GDPR</div>
          <div class="tag active" data-val="Risk Management">Risk Management</div>
          <div class="tag active" data-val="Sanzioni">Sanzioni</div>
          <div class="tag" data-val="PSD2/Pagamenti">PSD2/Pagamenti</div>
          <div class="tag" data-val="Antiriciclaggio Banca d'Italia">Banca d'Italia</div>
        </div>
      </div>

      <div class="filter-group">
        <label>Formato</label>
        <div class="tag-grid" id="format-tags">
          <div class="tag active" data-val="in presenza">In presenza</div>
          <div class="tag active" data-val="webinar online">Online/Webinar</div>
          <div class="tag active" data-val="ibrido">Ibrido</div>
        </div>

        <label style="margin-top:14px;">Costo</label>
        <div class="tag-grid" id="cost-tags">
          <div class="tag active" data-val="gratuiti">Gratuiti</div>
          <div class="tag active" data-val="a pagamento">A pagamento</div>
        </div>

        <label style="margin-top:14px;">Orizzonte temporale</label>
        <select class="select-styled" id="horizon-select">
          <option value="prossime 2 settimane">Prossime 2 settimane</option>
          <option value="prossimo mese" selected>Prossimo mese</option>
          <option value="prossimi 3 mesi">Prossimi 3 mesi</option>
          <option value="prossimi 6 mesi">Prossimi 6 mesi</option>
        </select>
      </div>
    </div>

    <button class="search-btn" id="search-btn" onclick="runSearch()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Cerca eventi ora
    </button>
  </div>

  <div class="status-bar" id="status-bar">
    <div class="spinner"></div>
    <span id="status-text">Ricerca in corso...</span>
  </div>

  <div id="summary-box" class="summary-box"></div>

  <div id="results-area"></div>

</div>

<script>
// Set date
const now = new Date();
document.getElementById('header-date').innerHTML =
  now.toLocaleDateString('it-IT', {weekday:'long', year:'numeric', month:'long', day:'numeric'}) +
  '<br>' + now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});

// Tag toggle
document.querySelectorAll('.tag').forEach(tag => {
  tag.addEventListener('click', () => tag.classList.toggle('active'));
});

function getActive(groupId) {
  return [...document.querySelectorAll(`#${groupId} .tag.active`)].map(t => t.dataset.val);
}

async function runSearch() {
  const topics = getActive('topic-tags');
  const formats = getActive('format-tags');
  const costs = getActive('cost-tags');
  const horizon = document.getElementById('horizon-select').value;

  if (topics.length === 0) {
    alert('Seleziona almeno un tema.');
    return;
  }

  const btn = document.getElementById('search-btn');
  const statusBar = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');
  const summaryBox = document.getElementById('summary-box');
  const resultsArea = document.getElementById('results-area');

  btn.disabled = true;
  statusBar.classList.add('visible');
  summaryBox.classList.remove('visible');
  resultsArea.innerHTML = '';

  const steps = [
    'Interrogo le fonti web...',
    'Cerco convegni e seminari...',
    'Verifico date e disponibilità...',
    'Strutturando i risultati...'
  ];
  let stepIdx = 0;
  statusText.textContent = steps[0];
  const stepInterval = setInterval(() => {
    stepIdx = (stepIdx + 1) % steps.length;
    statusText.textContent = steps[stepIdx];
  }, 2800);

  const todayStr = now.toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'});
  const topicList = topics.join(', ');
  const formatList = formats.length ? formats.join(', ') : 'qualsiasi formato';
  const costList = costs.length ? costs.join(' e ') : 'qualsiasi costo';

  const systemPrompt = `Sei un ricercatore specializzato in eventi professionali per compliance officer, AML specialist e risk manager italiani ed europei.
Data di oggi: ${todayStr}.

Il tuo compito è trovare eventi reali e verificati usando il web search. Rispondi SOLO con JSON valido, nessun testo prima o dopo.

Struttura JSON richiesta:
{
  "summary": "breve riepilogo in italiano di cosa hai trovato (2-3 righe)",
  "events": [
    {
      "title": "titolo evento",
      "organizer": "organizzatore",
      "date": "data o periodo (es: 15 aprile 2026)",
      "location": "città o 'Online'",
      "format": "In presenza | Online | Ibrido",
      "cost": "Gratuito | A pagamento | Da definire",
      "topics": ["topic1", "topic2"],
      "description": "descrizione breve (2-3 frasi in italiano)",
      "url": "URL reale se disponibile, altrimenti null",
      "source": "nome della fonte"
    }
  ]
}

Cerca eventi in Italia e Europa. Includi: convegni, seminari, webinar, corsi ECF/CPD, forum, summit. Trova almeno 6-10 eventi se disponibili. Se non trovi URL certi, lascia null — non inventare link.`;

  const userPrompt = `Cerca eventi professionali sui seguenti temi: ${topicList}.
Formato preferito: ${formatList}.
Costo: ${costList}.
Periodo: ${horizon} (da oggi, ${todayStr}).
Area geografica: Italia e/o Europa.

Usa il web search per trovare eventi reali e recenti. Considera organizzatori come: ACFE, AIRA, AICOM, ABI, Banca d'Italia, CLUSIT, Garante Privacy, ICA, EFPA, FBK, GRC Italy, ACAMS, FATF/GAFI, CAMS, IIF, European Banking Institute, Compliance Lab, Il Sole 24 Ore, Milano Finanza, Iter Formazione, Wolters Kluwer, e simili.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        system: systemPrompt,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    clearInterval(stepInterval);

    if (!response.ok) {
      throw new Error(`API error: ${response.status} ${response.statusText}`);
    }

    const data = await response.json();

    // Extract final text response
    let rawText = '';
    for (const block of data.content) {
      if (block.type === 'text') rawText += block.text;
    }

    // Parse JSON
    const cleanText = rawText.replace(/```json|```/g, '').trim();
    let parsed;
    try {
      parsed = JSON.parse(cleanText);
    } catch(e) {
      // Try to extract JSON from response
      const match = cleanText.match(/\{[\s\S]*\}/);
      if (match) parsed = JSON.parse(match[0]);
      else throw new Error('Impossibile parsare la risposta JSON.');
    }

    statusBar.classList.remove('visible');
    btn.disabled = false;

    // Show summary
    if (parsed.summary) {
      summaryBox.textContent = '> ' + parsed.summary;
      summaryBox.classList.add('visible');
    }

    // Render events
    const events = parsed.events || [];
    if (events.length === 0) {
      resultsArea.innerHTML = `
        <div class="message-box">
          <div class="icon">🔍</div>
          <p>Nessun evento trovato per i criteri selezionati nel periodo indicato. Prova ad ampliare l'orizzonte temporale o i temi.</p>
        </div>`;
    } else {
      resultsArea.innerHTML = `
        <div class="results-header">
          <div class="section-label">Risultati</div>
          <div class="results-count"><span>${events.length}</span> eventi trovati</div>
        </div>
        <div class="events-list" id="events-list"></div>`;

      const list = document.getElementById('events-list');
      events.forEach((ev, i) => {
        const topicBadges = (ev.topics || []).map(t =>
          `<span class="badge badge-topic">${t}</span>`).join('');
        const costBadge = ev.cost && ev.cost.toLowerCase().includes('gratuito')
          ? `<span class="badge badge-gratuito">Gratuito</span>`
          : ev.cost && ev.cost.toLowerCase().includes('pagamento')
          ? `<span class="badge badge-pagamento">A pagamento</span>`
          : `<span class="badge badge-data">${ev.cost || 'N/D'}</span>`;
        const formatBadge = ev.format
          ? `<span class="badge badge-format">${ev.format}</span>` : '';
        const dateBadge = ev.date
          ? `<span class="badge badge-data">📅 ${ev.date}</span>` : '';
        const linkEl = ev.url
          ? `<a class="event-link" href="${ev.url}" target="_blank" rel="noopener">Scopri ↗</a>`
          : `<span class="event-org">${ev.source || ''}</span>`;

        const card = document.createElement('div');
        card.className = 'event-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.innerHTML = `
          <div class="event-meta">
            ${dateBadge}
            ${formatBadge}
            ${costBadge}
            ${topicBadges}
          </div>
          <div class="event-title">${ev.title}</div>
          <div class="event-desc">${ev.description || ''}</div>
          <div class="event-footer">
            <span class="event-org">${ev.organizer || ''} — ${ev.location || ''}</span>
            ${linkEl}
          </div>`;
        list.appendChild(card);
      });
    }

  } catch(err) {
    clearInterval(stepInterval);
    statusBar.classList.remove('visible');
    btn.disabled = false;
    resultsArea.innerHTML = `
      <div class="message-box">
        <div class="icon">⚠️</div>
        <p><strong>Errore durante la ricerca:</strong><br>${err.message}<br><br>Riprova tra qualche istante.</p>
      </div>`;
  }
}
</script>
</body>
</html>
